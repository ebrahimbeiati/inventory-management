name: Deploy to AWS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_CLIENT: inventory-management-client
  ECR_REPOSITORY_SERVER: inventory-management-server
  ECS_CLUSTER: inventory-cluster
  ECS_SERVICE: inventory-service
  EC2_HOST: 54.87.65.21  # Replace with your EC2 instance IP
  EC2_USER: ec2-user  # Replace with your EC2 user (e.g., ubuntu, ec2-user)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push client image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_CLIENT:$IMAGE_TAG ./client
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_CLIENT:$IMAGE_TAG

      - name: Build and push server image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_SERVER:$IMAGE_TAG ./server
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_SERVER:$IMAGE_TAG

      - name: Deploy to EC2
        run: |
          # Save the private key to a file
          echo "${{ secrets.EC2_SSH_KEY }}" > deploy_key.pem
          chmod 600 deploy_key.pem

          # SSH into the EC2 instance and install Docker, configure AWS credentials, and pull the Docker images
          ssh -i deploy_key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'EOF'
            # Install Docker
            sudo yum update -y
            sudo yum install -y docker
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker $USER

            # Configure AWS credentials
            aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws configure set region us-east-1

            # Login to ECR
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            # Pull the Docker images
            docker pull ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY_CLIENT:$IMAGE_TAG
            docker pull ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY_SERVER:$IMAGE_TAG

            # Run the Docker containers
            docker run -d -p 3000:3000 ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY_CLIENT:$IMAGE_TAG
            docker run -d -p 4000:4000 ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY_SERVER:$IMAGE_TAG
          EOF

      - name: Update ECS services
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --force-new-deployment
